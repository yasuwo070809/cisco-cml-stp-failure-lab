!
! SW3 - Default priority bridge (spanning-tree vlan 1 priority 32768)
! Node type: IOL-L2 (ioll2-xe)
! Et0/1 is the expected blocking (Alternate) port toward SW2
!
hostname SW3
!
no ip domain-lookup
!
spanning-tree mode rapid-pvst
spanning-tree vlan 1 priority 32768
!
interface Vlan1
 ip address 192.168.1.3 255.255.255.0
 no shutdown
!
interface Ethernet0/0
 description LINK-TO-SW1
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface Ethernet0/1
 description LINK-TO-SW2 (BACKUP PATH - EXPECTED BLOCKING PORT)
 switchport mode access
 switchport access vlan 1
 no shutdown
!
interface Ethernet0/2
 shutdown
!
interface Ethernet0/3
 shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
